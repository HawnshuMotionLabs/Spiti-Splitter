<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Spiti 2026 · Trip Splitter</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Splitter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:800;font-display:swap;src:url(fonts/inter-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:400 500;font-display:swap;src:url(fonts/inter-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+20A0-20C0}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+20A0-20C0}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(fonts/inter-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+20A0-20C0}
@font-face{font-family:Inter;font-weight:800;font-display:swap;src:url(fonts/inter-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+20A0-20C0}
:root{
  --bg:#0b0d12;--bg2:#12151c;--card:#151922;--card2:#1b2029;--line:rgba(255,255,255,.07);
  --ink:#f2f4f8;--sub:#8d95a7;--faint:#5b6374;
  --a1:#2dd4bf;--a2:#6366f1;--acc:#5eead4;--grad:linear-gradient(135deg,#14b8a6 0%,#4f46e5 100%);
  --pos:#34d399;--neg:#fb7185;--warn:#fbbf24;
  --shadow:0 10px 30px rgba(0,0,0,.35);--r:18px;
  --safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:light){
  :root{--bg:#f2f3f7;--bg2:#e9ebf1;--card:#ffffff;--card2:#f5f6fa;--line:rgba(15,18,24,.07);
  --ink:#0f1218;--sub:#5f6778;--faint:#9aa1af;--acc:#0d9488;--pos:#059669;--neg:#e11d48;--warn:#b45309;--shadow:0 8px 24px rgba(20,25,40,.08)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer;padding:0}
input::placeholder{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:10;padding:calc(var(--safe-t) + 14px) 20px 12px;background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:center;gap:12px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em;flex:1}
.top .pill{font-size:12px;font-weight:600;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.dotlive.off{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.18)}
main{padding:0 16px calc(120px + var(--safe-b));max-width:680px;margin:0 auto}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.h{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.h button{color:var(--acc);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.muted{color:var(--sub)}.small{font-size:13px}.tiny{font-size:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 18px;background:var(--grad);color:#fff;box-shadow:0 18px 40px rgba(79,70,229,.35);margin-bottom:14px}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.hero:after{content:"";position:absolute;left:-40px;bottom:-90px;width:240px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hero .lbl{font-size:13px;font-weight:600;opacity:.85}
.hero .amt{font-size:40px;font-weight:800;letter-spacing:-.035em;margin:4px 0 2px;position:relative}
.hero .note{font-size:13px;opacity:.9;position:relative}
.hero .stats{display:flex;gap:8px;margin-top:16px;position:relative}
.hero .stats div{flex:1;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px}
.hero .stats b{display:block;font-size:16px;font-weight:700}
.hero .stats span{font-size:11px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px}
.qa svg{width:22px;height:22px;color:var(--acc)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:19px}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;font-weight:700;white-space:nowrap}
.row .end small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.day{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin:18px 6px 6px;display:flex;justify-content:space-between}

.av{border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:#fff;letter-spacing:-.02em}
.avs{display:flex}.avs .av{border:2px solid var(--card);margin-left:-8px}.avs .av:first-child{margin-left:0}

/* chips / seg */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--sub);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--sub);transition:.2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:10px}
.search input{flex:1;font-size:16px}
.search svg{width:18px;height:18px;color:var(--faint)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;font-weight:700;padding:13px 18px;border-radius:14px;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.btn.block{width:100%}
.btn svg{width:19px;height:19px;flex:none}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px;box-shadow:none}
.btn.soft{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 45%,transparent);box-shadow:none}
.btn:active,.qa button:active,.row:active,.chip:active{transform:scale(.98)}

/* debts */
.debtor{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.debtor .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.debtor .hd b{flex:1;font-size:16px}
.debtor .hd .tot{font-weight:800;color:var(--neg);font-size:17px}
.leg{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.leg .arrow{color:var(--faint);font-size:14px}
.leg .to{flex:1;font-weight:600}
.leg .am{font-weight:700;margin-right:4px}
.settled{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--pos) 10%,transparent);color:var(--pos);font-weight:600;font-size:14px;margin-bottom:12px}

/* bars / donut */
.pbar{height:8px;background:var(--card2);border-radius:5px;position:relative;margin-top:8px}
.pbar i{position:absolute;top:0;bottom:0;border-radius:5px}
.pbar .mid0{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.donut{display:flex;align-items:center;gap:18px}
.legend{flex:1;display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--sub)}

/* person card */
.pc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.pc .mid{flex:1;min-width:0}
.pc .mid b{font-weight:700}
.pc .mid .sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.pc .st{text-align:right;font-weight:800}
.pc .st small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kv span{display:block;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-size:18px;font-weight:800;display:block;margin-top:4px}

/* tab bar */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:20;max-width:560px;margin:0 auto;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;font-weight:600;color:var(--faint);border-radius:18px;transition:color .2s}
.tabbar button.on{color:var(--ink)}
.tabbar svg{width:23px;height:23px}
.tabbar .plus{flex:none;width:58px;height:58px;margin:-26px 6px 0;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(79,70,229,.45)}
.tabbar .plus svg{width:28px;height:28px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;max-height:93vh;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open{pointer-events:auto}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none;background:color-mix(in srgb,var(--sub) 40%,transparent)}
.sh-top{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;flex:none}
.sh-top b{font-size:16px;font-weight:700}
.sh-top button{font-weight:600;color:var(--acc);min-width:60px}
.sh-top button:last-child{text-align:right}
.sh-body{overflow-y:auto;padding:4px 18px calc(28px + var(--safe-b));-webkit-overflow-scrolling:touch}
.bigamt{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 0 6px}
.bigamt span{font-size:32px;font-weight:700;color:var(--sub)}
.bigamt input{font-size:46px;font-weight:800;letter-spacing:-.03em;width:70%;text-align:center}
.field{margin-bottom:16px}
.field>label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin:0 2px 8px}
.field>label em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--sub)}
.cats button .e{font-size:20px}
.cats button.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.ppl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--sub);position:relative;transition:.15s}
.pp.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.pp .ck{position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:var(--bg);font-size:11px;display:grid;place-items:center;font-weight:800;opacity:0;transform:scale(.5);transition:.15s}
.pp.on .ck{opacity:1;transform:none}
.pp .share{font-size:11.5px;color:var(--acc);font-weight:700;min-height:14px}
.pp.off-op{opacity:.35}
.line{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 12px;margin-bottom:8px}
.line .nm{flex:1;font-weight:600}
.line input{width:118px;text-align:right;background:var(--card2);border-radius:10px;padding:9px 10px;font-size:16px;font-weight:600}
.status{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:600;padding:12px 14px;border-radius:14px;margin-bottom:16px;line-height:1.4}
.status.ok{background:color-mix(in srgb,var(--pos) 12%,transparent);color:var(--pos)}
.status.bad{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.link{color:var(--acc);font-weight:600;font-size:13px}

/* detail */
.dhead{text-align:center;padding:10px 0 18px}
.dhead .ic{width:60px;height:60px;border-radius:18px;font-size:28px;margin:0 auto 10px}
.dhead h2{font-size:20px;font-weight:700}
.dhead .a{font-size:36px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.dhead .m{font-size:13px;color:var(--sub);margin-top:4px}
.map{display:flex;align-items:center;gap:10px;padding:11px 0}
.map+.map{border-top:1px solid var(--line)}
.map .nm{flex:1;font-weight:600}
.map .nm span{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-top:1px}
.flow{display:flex;align-items:center;gap:8px;padding:11px 0;font-weight:600}
.flow+.flow{border-top:1px solid var(--line)}
.flow .ar{color:var(--faint)}
.flow .x{flex:1}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--sub);text-transform:uppercase;letter-spacing:.05em}

.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.empty .e{font-size:40px;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.25s;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast button{color:var(--a1);font-weight:800}
@media (prefers-color-scheme:light){#toast button{color:#5eead4}}
.settingrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.settingrow+.settingrow{border-top:1px solid var(--line)}
.settingrow .t{flex:1}
.settingrow .t span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.ren{flex:1;font-size:16px;font-weight:600;padding:6px 0;min-width:0}
</style>
</head>
<body>
<div class="top"><h1 id="title">Spiti 2026</h1><div class="pill" id="netpill"><i class="dotlive"></i><span>Offline ready</span></div></div>
<main id="main"></main>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet" id="sheet"><div class="scrim" data-act="close"></div><div class="panel"><div class="grab"></div><div id="sheetInner" style="display:flex;flex-direction:column;min-height:0"></div></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
/* ================= data ================= */
const KEY='spiti-splitter-v1';
const CATS=[
 ['food','Food','🍜','#f97316'],['stay','Stay','🏕️','#8b5cf6'],['fuel','Fuel','⛽','#06b6d4'],['transport','Travel','🚙','#3b82f6'],
 ['permits','Permits','🎟️','#84cc16'],['activities','Fun','🏔️','#ec4899'],['shopping','Shopping','🛍️','#eab308'],['drinks','Drinks','🍻','#f59e0b'],
 ['games','Games','🃏','#64748b'],['other','Other','📦','#94a3b8']];
const AVC=[['#14b8a6','#0ea5e9'],['#8b5cf6','#6366f1'],['#ec4899','#f43f5e'],['#f97316','#eab308'],['#22c55e','#14b8a6'],['#3b82f6','#8b5cf6'],['#f43f5e','#f97316'],['#06b6d4','#22c55e']];
function defaults(){return {v:1,name:'Spiti 2026',me:'m1',members:[
 {id:'m1',name:'Sudhanshu'},{id:'m2',name:'Kaustubh'},{id:'m3',name:'Shruti Punjani'},{id:'m4',name:'Shruti Shah'},{id:'m5',name:'Sumit'},{id:'m6',name:'Bhavesh'}],items:[]}}
let D;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!D||!Array.isArray(D.members))D=defaults();
let storageOK=true;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));storageOK=true}catch(e){storageOK=false;toast('Could not save on this device')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const UI={tab:'home',q:'',fPerson:'all',fCat:'all',mode:'simple'};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[,₹\s]/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const money=n=>'₹'+Math.abs(r2(n)).toLocaleString('en-IN',{maximumFractionDigits:2});
const sum=a=>a.reduce((x,y)=>x+y,0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= money engine ================= */
const total=e=>sum(Object.values(e.paid||{}).map(num));
function shares(e){ // id -> share of this expense
  const T=total(e),s=e.split||{},am=s.among||[],v=s.values||{},o={};
  if(s.mode==='exact')am.forEach(i=>o[i]=num(v[i]));
  else if(s.mode==='shares'){const t=sum(am.map(i=>num(v[i])));am.forEach(i=>o[i]=t?T*num(v[i])/t:0)}
  else am.forEach(i=>o[i]=am.length?T/am.length:0);
  return o;
}
function expenseFlows(e){ // who owes whom for this one expense
  const T=total(e),pd=e.paid||{},sh=shares(e),out=[];if(!T)return out;
  for(const i in sh)for(const j in pd){if(i===j)continue;const a=sh[i]*num(pd[j])/T;if(a>0.004)out.push({from:i,to:j,amt:a})}
  return out;
}
function ledger(){
  const ids=new Set(D.members.map(m=>m.id));
  D.items.forEach(e=>{if(e.type==='payment'){ids.add(e.from);ids.add(e.to)}else{Object.keys(e.paid||{}).forEach(i=>ids.add(i));(e.split?.among||[]).forEach(i=>ids.add(i))}});
  const L={ids:[...ids],net:{},paid:{},share:{},sent:{},recv:{},P:{}};
  L.ids.forEach(i=>{L.net[i]=L.paid[i]=L.share[i]=L.sent[i]=L.recv[i]=0;L.P[i]={};L.ids.forEach(j=>L.P[i][j]=0)});
  for(const e of D.items){
    if(e.type==='payment'){const a=num(e.amount);L.net[e.from]+=a;L.net[e.to]-=a;L.sent[e.from]+=a;L.recv[e.to]+=a;L.P[e.to][e.from]+=a;continue}
    const pd=e.paid||{},sh=shares(e);
    for(const i in pd){L.paid[i]+=num(pd[i]);L.net[i]+=num(pd[i])}
    for(const i in sh){L.share[i]+=sh[i];L.net[i]-=sh[i]}
    expenseFlows(e).forEach(f=>L.P[f.from][f.to]+=f.amt);
  }
  return L;
}
function simplify(net){
  const cr=[],dr=[];
  for(const i in net){const v=r2(net[i]);if(v>0.5)cr.push([i,v]);else if(v<-0.5)dr.push([i,-v])}
  cr.sort((a,b)=>b[1]-a[1]);dr.sort((a,b)=>b[1]-a[1]);
  const out=[];let a=0,b=0;
  while(a<dr.length&&b<cr.length){const x=Math.min(dr[a][1],cr[b][1]);if(x>0.5)out.push({from:dr[a][0],to:cr[b][0],amt:r2(x)});dr[a][1]-=x;cr[b][1]-=x;if(dr[a][1]<0.5)a++;if(cr[b][1]<0.5)b++}
  return out;
}
function direct(L){
  const out=[];
  for(let a=0;a<L.ids.length;a++)for(let b=a+1;b<L.ids.length;b++){const x=L.ids[a],y=L.ids[b],d=L.P[x][y]-L.P[y][x];if(d>0.5)out.push({from:x,to:y,amt:r2(d)});else if(d<-0.5)out.push({from:y,to:x,amt:r2(-d)})}
  return out.sort((p,q)=>q.amt-p.amt);
}
const transfers=L=>UI.mode==='simple'?simplify(L.net):direct(L);
function impact(e,p){if(e.type==='payment')return e.from===p?num(e.amount):e.to===p?-num(e.amount):0;return num((e.paid||{})[p])-(shares(e)[p]||0)}
const involves=(e,p)=>e.type==='payment'?(e.from===p||e.to===p):(p in (e.paid||{}))||(e.split?.among||[]).includes(p);
const sorted=()=>[...D.items].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const spend=()=>sum(D.items.filter(e=>e.type!=='payment').map(total));

  <div class="field"><label>Paid by <button class="link" style="text-transform:none;letter-spacing:0" data-act="multi">${f.multi?'Only one person paid':'+ Several people paid'}</button></label><div class="ppl">${ms.map(m=>`<button class="pp ${f.payers.includes(m.id)?'on':''}" data-act="payer" data-v="${m.id}"><span class="ck">✓</span>${av(m.id,38)}${esc(isMe(m.id)?'You':m.name.split(' ')[0]+(ms.filter(x=>x.name.split(' ')[0]===m.name.split(' ')[0]).length>1?' '+(m.name.split(' ')[1]||'')[0]+'.':''))}</button>`).join('')}</div>
  ${f.multi&&f.payers.length?`<div style="margin-top:10px">${f.payers.map(id=>`<div class="line">${av(id,30)}<span class="nm">${esc(isMe(id)?'You':nm(id))} paid</span><input data-f="pv:${id}" inputmode="decimal" placeholder="₹0" value="${esc(f.pv[id]||'')}"></div>`).join('')}<div class="tiny muted" id="payerHint" style="margin:2px 4px"></div></div>`:''}</div>
  <div class="field"><label>Split <em id="splitHint"></em></label><div class="seg" style="margin-bottom:10px">${[['equal','Equally'],['exact','Exact ₹'],['shares','Shares']].map(([k,l])=>`<button class="${f.mode===k?'on':''}" data-act="mode-s" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(f.mode==='equal')h+=`<div class="ppl">${ms.map(m=>`<button class="pp ${f.among.has(m.id)?'on':'off-op'}" data-act="tog" data-v="${m.id}"><span class="ck">✓</span>${av(m.id,38)}${esc(isMe(m.id)?'You':m.name.split(' ')[0]+(ms.filter(x=>x.name.split(' ')[0]===m.name.split(' ')[0]).length>1?' '+(m.name.split(' ')[1]||'')[0]+'.':''))}<span class="share num" data-each="${m.id}"></span></button>`).join('')}</div>
    <div style="display:flex;gap:16px;justify-content:center;margin-top:10px"><button class="link" data-act="all">Select everyone</button><button class="link" data-act="none">Clear</button></div>`;
  else h+=ms.map(m=>`<div class="line">${av(m.id,30)}<span class="nm">${esc(isMe(m.id)?'You':nm(m.id))}<span class="tiny muted num" data-sh="${m.id}" style="display:block;font-weight:500"></span></span><input data-f="v:${m.id}" inputmode="decimal" placeholder="${f.mode==='exact'?'₹0':'0'}" value="${esc(f.vals[m.id]||'')}"></div>`).join('')+(f.mode==='shares'?`<div class="tiny muted" style="margin:2px 4px">e.g. 2 for a couple sharing a room, 1 for everyone else.</div>`:'');
  h+=`</div><div class="status" id="status"></div>
  <div class="two"><div class="field"><label>Date</label><input class="inp" type="date" data-f="date" value="${esc(f.date)}"></div><div class="field"><label>Note</label><input class="inp" data-f="note" placeholder="Optional" value="${esc(f.note)}"></div></div>
  <button class="btn block" data-act="save-exp">${f.id?'Save changes':'Add expense'}</button></div>`;
  return h;
}
function vExp(){
  const f=F,T=r2(num(f.amount));
  if(T<=0)return {ok:false,msg:'Enter the total amount at the top.'};
  if(!f.payers.length)return {ok:false,msg:'Choose who paid.'};
  const paid={};
  if(!f.multi||f.payers.length===1)paid[f.payers[0]]=T;
  else{let s=0;for(const i of f.payers){const v=r2(num(f.pv[i]));if(v>0){paid[i]=v;s+=v}}if(Math.abs(s-T)>0.01)return {ok:false,msg:`Paid-by amounts add up to ${money(s)}, total is ${money(T)}. ${s<T?money(T-s)+' still to assign.':money(s-T)+' too much.'}`}}
  let among=[],values={},msg;
  if(f.mode==='equal'){among=[...f.among].filter(i=>member(i));if(!among.length)return {ok:false,msg:'Pick who shares this expense.'};msg=`${money(T/among.length)} each, split between ${among.length}`}
  else if(f.mode==='exact'){let s=0;D.members.forEach(m=>{const v=r2(num(f.vals[m.id]));if(v>0){among.push(m.id);values[m.id]=v;s+=v}});if(Math.abs(s-T)>0.01)return {ok:false,msg:`${money(s)} of ${money(T)} assigned. ${s<T?money(T-s)+' left to assign.':money(s-T)+' too much.'}`};msg='Exact amounts add up to the total'}
  else{let s=0;D.members.forEach(m=>{const v=num(f.vals[m.id]);if(v>0){among.push(m.id);values[m.id]=v;s+=v}});if(!s)return {ok:false,msg:'Give shares to the people in this expense.'};msg=`Split by shares between ${among.length}`}
  const doc={id:f.id||uid(),type:'expense',title:f.title.trim()||cat(f.cat)[1],cat:f.cat,date:f.date||today(),note:f.note.trim(),paid,split:{mode:f.mode,among,values},createdAt:f.createdAt||Date.now()};
  const fl=expenseFlows(doc);
  if(fl.length)msg+=' · '+(fl.length<=3?fl.map(x=>`${short(x.from)} owes ${short(x.to)} ${money(x.amt)}`).join(', '):`${fl.length} people owe the payer${f.payers.length>1?'s':''}`);
  return {ok:true,msg,doc};
}
/* --- payment form --- */
function startPay(e,pre){
  if(e)F={k:'pay',id:e.id,from:e.from,to:e.to,amount:String(e.amount),date:e.date||today(),note:e.note||'',createdAt:e.createdAt};
  else F={k:'pay',from:pre?.from||'',to:pre?.to||'',amount:pre?String(pre.amt):'',date:today(),note:pre?'Settled up':''};
  openSheet('pay');
}
function sPay(){
  const f=F,ms=D.members,lab=m=>esc(isMe(m.id)?'You':m.name.split(' ')[0]+(ms.filter(x=>x.name.split(' ')[0]===m.name.split(' ')[0]).length>1?' '+(m.name.split(' ')[1]||'')[0]+'.':''));
  let h=top3(`<button data-act="${f.id?'back':'close'}">${f.id?'Back':'Cancel'}</button>`,f.id?'Edit payment':'Record payment',`<button data-act="save-pay">Save</button>`)+`<div class="sh-body">`;
  if(!f.id)h+=`<div class="seg" style="margin-bottom:6px"><button data-act="switch-exp">Expense</button><button class="on">Payment</button></div>`;
  h+=`<div class="bigamt"><span>₹</span><input data-f="amount" inputmode="decimal" placeholder="0" value="${esc(f.amount)}"></div>
  <div class="field"><label>Who paid</label><div class="ppl">${ms.map(m=>`<button class="pp ${f.from===m.id?'on':''}" data-act="pfrom" data-v="${m.id}"><span class="ck">✓</span>${av(m.id,38)}${lab(m)}</button>`).join('')}</div></div>
  <div class="field"><label>Paid to</label><div class="ppl">${ms.map(m=>`<button class="pp ${f.to===m.id?'on':''} ${f.from===m.id?'off-op':''}" data-act="pto" data-v="${m.id}" ${f.from===m.id?'disabled':''}><span class="ck">✓</span>${av(m.id,38)}${lab(m)}</button>`).join('')}</div></div>
  <div class="status" id="status"></div>
  <div class="two"><div class="field"><label>Date</label><input class="inp" type="date" data-f="date" value="${esc(f.date)}"></div><div class="field"><label>Note</label><input class="inp" data-f="note" placeholder="UPI, cash…" value="${esc(f.note)}"></div></div>
  <button class="btn block" data-act="save-pay">${f.id?'Save changes':'Record payment'}</button></div>`;
  return h;
}
function vPay(){
  const f=F,a=r2(num(f.amount));
  if(!f.from)return {ok:false,msg:'Choose who paid.'};
  if(!f.to||f.to===f.from)return {ok:false,msg:'Choose who received the money.'};
  if(a<=0)return {ok:false,msg:'Enter the amount at the top.'};
  const L=ledger(),owe=r2((L.P[f.from]?.[f.to]||0)-(L.P[f.to]?.[f.from]||0));
  let msg=`${short(f.from)} paid ${short(f.to)} ${money(a)}`;
  if(!f.id&&owe>0.5)msg+=` · they owed ${money(owe)} directly`;
  return {ok:true,msg,doc:{id:f.id||uid(),type:'payment',from:f.from,to:f.to,amount:a,date:f.date||today(),note:f.note.trim(),createdAt:f.createdAt||Date.now()}};
}
function updStatus(){
  const s=$('#status');if(!s||!F)return;
  const r=F.k==='exp'?vExp():vPay();
  s.className='status '+(r.ok?'ok':'bad');s.innerHTML=(r.ok?'✓ ':'• ')+esc(r.msg);
  if(F.k==='exp'){
    const T=num(F.amount);
    if(F.mode==='equal'){const n=F.among.size;document.querySelectorAll('[data-each]').forEach(el=>el.textContent=F.among.has(el.dataset.each)&&T>0?money(T/n):'')}
    else if(F.mode==='shares'){const t=sum(D.members.map(m=>num(F.vals[m.id])));document.querySelectorAll('[data-sh]').forEach(el=>{const v=num(F.vals[el.dataset.sh]);el.textContent=v>0&&t&&T?money(T*v/t):''})}
    else document.querySelectorAll('[data-sh]').forEach(el=>el.textContent='');
    const hint=$('#splitHint');if(hint){const asg=F.mode==='exact'?sum(D.members.map(m=>num(F.vals[m.id]))):null;hint.textContent=F.mode==='exact'&&T?`${money(Math.max(0,T-asg))} left to assign`:''}
    const ph=$('#payerHint');if(ph){const s2=sum(F.payers.map(i=>num(F.pv[i])));ph.textContent=T?`${money(s2)} of ${money(T)} entered`:''}
  }
}
/* --- expense / payment detail --- */
function sDetail(){
  const e=D.items.find(x=>x.id===F.id);if(!e){return top3('<span></span>','Not found','<button data-act="close">Done</button>')}
  let h=top3(`<button data-act="close">Close</button>`,e.type==='payment'?'Payment':'Expense',`<button data-act="edit">Edit</button>`)+`<div class="sh-body">`;
  if(e.type==='payment'){
    h+=`<div class="dhead"><div class="ic" style="background:color-mix(in srgb,#10b981 18%,transparent)">💸</div><h2>${esc(nm(e.from))} → ${esc(nm(e.to))}</h2><div class="a num">${money(e.amount)}</div><div class="m">${esc(fmtDay(e.date))}${e.note?' · '+esc(e.note):''}</div></div>
    <div class="card" style="padding:4px 16px"><div class="flow">${av(e.from,32)}<div class="x">${esc(nm(e.from))}<div class="tiny muted">Paid</div></div><span class="ar">→</span>${av(e.to,32)}<div class="x">${esc(nm(e.to))}<div class="tiny muted">Received</div></div></div></div>`;
  }else{
    const c=cat(e.cat),T=total(e),sh=shares(e),pd=e.paid||{},fl=expenseFlows(e);

    h+=`<div class="dhead"><div class="ic" style="background:color-mix(in srgb,${c[3]} 18%,transparent)">${c[2]}</div><h2>${esc(e.title)}</h2><div class="a num">${money(T)}</div><div class="m">${esc(fmtDay(e.date))} · ${c[1]}${e.note?' · '+esc(e.note):''}</div></div>
    <div class="h" style="margin-top:0">Paid by</div><div class="card" style="padding:4px 16px">${Object.keys(pd).map(i=>`<div class="map">${av(i,34)}<div class="nm">${esc(nm(i))}</div><b class="num">${money(pd[i])}</b></div>`).join('')}</div>
    <div class="h">${modeTxt}</div><div class="card" style="padding:4px 16px">${Object.keys(sh).map(i=>{const p=num(pd[i]),n=p-sh[i];return `<div class="map">${av(i,34)}<div class="nm">${esc(nm(i))}<span>${p?'Paid '+money(p)+' · ':''}${e.split?.mode==='shares'?num(e.split.values[i])+' share'+(num(e.split.values[i])===1?'':'s'):'share'}</span></div><div style="text-align:right"><b class="num">${money(sh[i])}</b><div class="tiny num ${n>0.004?'pos':n<-0.004?'neg':'muted'}" style="font-weight:600">${n>0.004?'gets '+money(n):n<-0.004?'owes '+money(n):'even'}</div></div></div>`}).join('')}</div>
    <div class="h">Who owes whom for this</div><div class="card" style="padding:4px 16px">${fl.length?fl.map(x=>`<div class="flow">${av(x.from,28)}<span class="x">${esc(nm(x.from))} <span class="ar">→</span> ${esc(nm(x.to))}</span><b class="num">${money(x.amt)}</b></div>`).join(''):'<div class="flow muted">No one owes anything for this</div>'}</div>
    <div class="tiny muted" style="margin:-4px 4px 14px">Overall balances in "Left to pay" combine all expenses and payments.</div>`;
  }
  h+=`<button class="btn block danger" data-act="del">Delete</button></div>`;
  return h;
}
/* --- person detail --- */
function sPerson(){
  const id=F.id,L=ledger(),v=L.net[id]||0,tx=transfers(L);
  const owes=tx.filter(t=>t.from===id),gets=tx.filter(t=>t.to===id);
  let h=top3('<span style="min-width:60px"></span>',esc(nm(id)),`<button data-act="close">Done</button>`)+`<div class="sh-body">`;
  h+=`<div class="dhead"><div style="display:flex;justify-content:center;margin-bottom:10px">${av(id,64)}</div><div class="a num ${v>0.5?'pos':v<-0.5?'neg':''}">${Math.abs(v)>0.5?money(v):'Settled'}</div><div class="m">${v>0.5?'Gets back overall':v<-0.5?'Left to pay overall':'Nothing pending'}</div></div>
  <div class="kv"><div><span>Paid for group</span><b class="num">${money(L.paid[id]||0)}</b></div><div><span>Their share</span><b class="num">${money(L.share[id]||0)}</b></div><div><span>Paid back</span><b class="num">${money(L.sent[id]||0)}</b></div><div><span>Received</span><b class="num">${money(L.recv[id]||0)}</b></div></div>`;
  if(owes.length)h+=`<div class="h" style="margin-top:0">Left to pay <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${UI.mode==='simple'?'fewest payments':'direct'}</span></div><div class="card" style="padding:4px 16px">${owes.map(t=>`<div class="flow"><span class="ar">→</span>${av(t.to,28)}<span class="x">${esc(nm(t.to))}</span><b class="num neg">${money(t.amt)}</b><button class="btn sm soft" style="margin-left:8px" data-act="markpaid" data-f="${t.from}" data-t="${t.to}" data-a="${t.amt}">Paid ✓</button></div>`).join('')}</div>`;
  if(gets.length)h+=`<div class="h"${owes.length?'':' style="margin-top:0"'}>Will receive</div><div class="card" style="padding:4px 16px">${gets.map(t=>`<div class="flow">${av(t.from,28)}<span class="x">${esc(nm(t.from))}</span><b class="num pos">${money(t.amt)}</b></div>`).join('')}</div>`;
  const items=sorted().filter(e=>involves(e,id));
  h+=`<div class="h">Their entries · ${items.length}</div>`+(items.length?`<div class="card" style="padding:2px 14px">${items.map(e=>itemRow(e,id)).join('')}</div>`:'<div class="card empty">No entries yet</div>');
  return h+`</div>`;
}
/* --- people editor --- */
function sPeople(){
  const used=new Set();D.items.forEach(e=>{if(e.type==='payment'){used.add(e.from);used.add(e.to)}else{Object.keys(e.paid||{}).forEach(i=>used.add(i));(e.split?.among||[]).forEach(i=>used.add(i))}});
  return top3('<span style="min-width:60px"></span>','People',`<button data-act="close">Done</button>`)+`<div class="sh-body"><div class="card" style="padding:4px 16px">${D.members.map(m=>`<div class="settingrow">${av(m.id,36)}<input class="ren" data-ren="${m.id}" value="${esc(m.name)}">${used.has(m.id)||D.members.length<=1?'':`<button class="btn sm danger" data-act="rm" data-v="${m.id}">Remove</button>`}</div>`).join('')}</div>
  <div class="two"><input class="inp" id="newp" placeholder="Add a person"><button class="btn" style="flex:none" data-act="addp">Add</button></div>
  <div class="tiny muted" style="margin:10px 4px">Tap a name to rename. People already in entries can't be removed.</div></div>`;

function sConfirm(){
  return top3('<span style="min-width:60px"></span>','Start over?','<span style="min-width:60px"></span>')+`<div class="sh-body"><div class="empty" style="padding:20px"><div class="e">⚠️</div><b>Delete all ${D.items.length} entries?</b>People stay. Export a backup first if you might need it.</div><div class="two"><button class="btn soft" data-act="close">Cancel</button><button class="btn danger" data-act="doreset">Delete all</button></div></div>`;

/* ================= actions ================= */
function upsert(doc){const i=D.items.findIndex(x=>x.id===doc.id);if(i>=0)D.items[i]=doc;else D.items.push(doc);persist();render()}
function summary(){
  const L=ledger(),tx=transfers(L);
  let t=`*${D.name} — Trip expenses*\nTotal spent: ${money(spend())}\n\n*Balances*\n`;
  D.members.forEach(m=>{const v=L.net[m.id]||0;t+=`• ${m.name}: ${v>0.5?'gets back '+money(v):v<-0.5?'left to pay '+money(v):'settled ✓'}\n   paid ${money(L.paid[m.id]||0)} · share ${money(L.share[m.id]||0)}\n`});
  t+=`\n*Who pays whom*\n`+(tx.length?tx.map(x=>`• ${nm(x.from)} → ${nm(x.to)}: ${money(x.amt)}`).join('\n'):'Everyone is settled up ✓');
  return t;
}
async function shareText(t){
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Summary copied, paste it in WhatsApp')}catch(e){toast('Could not share')}
}
async function exportData(){
  const name=`splitter-backup-${today()}.json`,blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup saved');
}
$('#importFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.members)||!Array.isArray(d.items))throw 0;D=d;persist();render();toast(`Restored ${d.items.length} entries`)}catch(e){toast('That file is not a valid backup')}
});

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'tab':UI.tab=v;render();window.scrollTo({top:0});break;
    case 'add':case 'new-exp':startExp();break;
    case 'new-pay':startPay();break;
    case 'switch-pay':startPay();break;
    case 'switch-exp':startExp();break;
    case 'close':closeSheet();break;
    case 'open':{const e=D.items.find(x=>x.id===v);if(!e)break;F={id:v};openSheet('detail');break}
    case 'person':F={id:v};openSheet('person');break;
    case 'edit':{const e=D.items.find(x=>x.id===F.id);if(!e)break;e.type==='payment'?startPay(e):startExp(e);break}
    case 'back':F={id:F.id};SH='detail';drawSheet();break;
    case 'del':{const e=D.items.find(x=>x.id===F.id);if(!e)break;D.items=D.items.filter(x=>x.id!==e.id);persist();closeSheet();render();toast('Deleted',()=>{D.items.push(e);persist();render()});break}
    case 'cat':F.cat=v;F._keep=1;drawSheet();break;
    case 'payer':{if(F.multi){const i=F.payers.indexOf(v);i>=0?F.payers.splice(i,1):F.payers.push(v)}else F.payers=[v];F._keep=1;drawSheet();break}
    case 'multi':F.multi=!F.multi;if(!F.multi)F.payers=F.payers.slice(0,1);F._keep=1;drawSheet();break;
    case 'mode-s':F.mode=v;F._keep=1;drawSheet();break;
    case 'tog':F.among.has(v)?F.among.delete(v):F.among.add(v);F._keep=1;drawSheet();break;
    case 'all':F.among=new Set(D.members.map(m=>m.id));F._keep=1;drawSheet();break;
    case 'none':F.among=new Set();F._keep=1;drawSheet();break;
    case 'pfrom':F.from=v;if(F.to===v)F.to='';F._keep=1;drawSheet();break;
    case 'pto':F.to=v;F._keep=1;drawSheet();break;
    case 'save-exp':case 'save-pay':{const r=F.k==='exp'?vExp():vPay();if(!r.ok){updStatus();toast(r.msg);break}const was=!!F.id;upsert(r.doc);closeSheet();toast(was?'Saved':r.doc.type==='payment'?'Payment recorded':'Expense added');break}
    case 'mode':UI.mode=v;render();break;
    case 'markpaid':startPay(null,{from:b.dataset.f,to:b.dataset.t,amt:b.dataset.a});break;
    case 'fp':UI.fPerson=v;render();break;
    case 'fc':UI.fCat=v;render();break;
    case 'sharesum':shareText(summary());break;
    case 'editppl':openSheet('ppl');break;
    case 'addp':{const n=$('#newp').value.trim();if(!n)break;let k=1;while(D.members.some(m=>m.id==='m'+k))k++;D.members.push({id:'m'+k,name:n});persist();drawSheet();render();break}
    case 'rm':D.members=D.members.filter(m=>m.id!==v);if(!member(D.me))D.me=D.members[0].id;persist();drawSheet();render();break;
    case 'export':exportData();break;
    case 'import':$('#importFile').click();break;
    case 'reset':openSheet('confirm');break;
    case 'doreset':{const old=D.items;D.items=[];persist();closeSheet();render();toast('All entries deleted',()=>{D.items=old;persist();render()});break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){UI.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}return}
  const k=t.dataset.f;if(!k||!F)return;
  if(k.startsWith('pv:'))F.pv[k.slice(3)]=t.value;else if(k.startsWith('v:'))F.vals[k.slice(2)]=t.value;else F[k]=t.value;
  updStatus();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='tripname'){D.name=t.value.trim()||'Trip';persist();render()}
  else if(t.id==='meSel'){D.me=t.value;persist();render()}
  else if(t.dataset.ren){const m=member(t.dataset.ren),n=t.value.trim();if(m&&n){m.name=n;persist();render()}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newp')$('[data-act="addp"]').click()});
function netState(){const p=$('#netpill');const on=navigator.onLine;p.innerHTML=`<i class="dotlive ${on?'':'off'}"></i><span>${on?'Saved on phone':'Offline · saving'}</span>`}
addEventListener('online',netState);addEventListener('offline',netState);
render();netState();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
